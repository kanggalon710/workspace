<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand gradient: sky-500 → blue-700 (matches login + portal hero) -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <!-- Subtle highlight for depth -->
    <radialGradient id="highlight" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Inner shadow effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Rounded square background with brand gradient -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle top-left highlight -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#highlight)"/>

  <!-- Bold "J" letter — workspace anchor -->
  <g filter="url(#shadow)">
    <path d="M 256 124
             L 256 320
             Q 256 360 220 360
             Q 184 360 184 320
             L 184 296"
          stroke="white" stroke-width="44" stroke-linecap="round" fill="none"/>
    <!-- Top crossbar -->
    <line x1="200" y1="124" x2="312" y2="124" stroke="white" stroke-width="44" stroke-linecap="round"/>
  </g>

  <!-- Wifi/broadcast waves (top right) — subtle, indicates connectivity -->
  <g opacity="0.85">
    <!-- Outer arc -->
    <path d="M 350 90
             a 56 56 0 0 1 72 0"
          stroke="white" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Middle arc -->
    <path d="M 364 110
             a 36 36 0 0 1 44 0"
          stroke="white" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.85"/>
    <!-- Center dot (signal source) -->
    <circle cx="386" cy="138" r="9" fill="white"/>
  </g>
</svg>

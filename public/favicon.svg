<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand gradient sky-400 -> blue-600 (samakan dgn logo dalam aplikasi) -->
    <linearGradient id="bg" x1="80" y1="60" x2="440" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="hi" cx="32%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1220" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Kotak brand -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#hi)"/>

  <!-- Mark: sinyal/broadcast (lucide Radio) - identik dengan logo dalam app -->
  <g transform="translate(116 116) scale(11.667)" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="2" fill="#FFFFFF" stroke="none"/>
    <path d="M7.76 16.24a6 6 0 0 1 0 -8.49"/>
    <path d="M16.24 7.76a6 6 0 0 1 0 8.49"/>
    <path d="M4.93 19.07a10 10 0 0 1 0 -14.14"/>
    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
  </g>
</svg>

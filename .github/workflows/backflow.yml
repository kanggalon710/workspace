name: Backflow main → dev

# Setiap push ke `main` (hotfix langsung ke prod, atau merge dari `dev`),
# auto-create / refresh PR untuk merge balik ke `dev` supaya dev tidak drift.
# Kalau dev sudah ancestor of main (fast-forward possible), workflow skip.
# Workflow ini tidak auto-merge — user harus klik merge di GitHub UI (review checkpoint).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  backflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # butuh full history untuk merge-base check

      - name: Check if dev branch exists
        id: check-dev
        run: |
          if git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::Branch 'dev' tidak ada di remote — skip backflow"
          fi

      - name: Check if backflow needed
        id: check-diff
        if: steps.check-dev.outputs.exists == 'true'
        run: |
          git fetch origin dev:dev
          # Kalau main sudah ancestor of dev → tidak ada commit untuk backflow
          if git merge-base --is-ancestor origin/main dev; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "::notice::dev sudah include semua commit main — no backflow needed"
          else
            COUNT=$(git rev-list --count dev..origin/main)
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "commits=$COUNT" >> $GITHUB_OUTPUT
            echo "::notice::Ada $COUNT commit di main yang belum ada di dev — open backflow PR"
          fi

      - name: Open or update backflow PR
        if: steps.check-diff.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --base dev --head main --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            echo "PR backflow #$EXISTING sudah open — GitHub auto-update head"
            gh pr comment "$EXISTING" --body "Backflow refresh: ${{ steps.check-diff.outputs.commits }} commit dari main belum di dev (SHA: ${GITHUB_SHA::7})."
          else
            gh pr create \
              --base dev \
              --head main \
              --title "Backflow main → dev (${{ steps.check-diff.outputs.commits }} commit)" \
              --body "$(cat <<EOF
          Auto-generated PR untuk merge commit hotfix dari \`main\` ke \`dev\` supaya branch dev tidak drift.

          **Commit yang belum ada di dev**: ${{ steps.check-diff.outputs.commits }}
          **Trigger SHA**: ${GITHUB_SHA::7}

          ## Action

          - Review diff
          - Merge (squash atau merge commit, terserah)
          - Setelah merge, GHA build trigger di branch \`dev\` → push ke \`deploy-dev\` → cPanel dev pull

          ## Skip jika

          Sengaja mau biarin dev tertinggal (jarang). Tutup PR ini manual.

          ---
          🤖 Generated by .github/workflows/backflow.yml
          EOF
          )"
          fi
